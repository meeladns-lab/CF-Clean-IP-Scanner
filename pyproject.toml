[project]
name = "cf-clean-ip-scanner"
version = "1.1.0"
description = "Cloudflare Clean IP Scanner for Iran — random sample, colo tagging, jitter/loss, Top5 speed"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CF Scanner"}]
dependencies = [
    "flet==0.86.5",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]
[project.scripts]
cf-scanner = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.flet]
# Flet build config for Windows + Android (single codebase)
app_name = "CF Clean IP Scanner"
app_version = "1.1.0"
description = "Cloudflare Clean IP Scanner for Iran"
org = "com.melad.cfscanner"
# Used by `flet build` — no Flutter needed for `flet run`, but needed for pack/apk
distpath = "dist"
